spring:
  application:
    name: bigbread-collector
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bigbread}
    username: ${DB_USERNAME:bigbread}
    password: ${DB_PASSWORD:bigbread}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # 스키마 마이그레이션은 api 모듈이 담당한다 (동시 실행 경합 방지)
    enabled: false
