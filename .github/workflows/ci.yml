name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: bigbread
          POSTGRES_USER: bigbread
          POSTGRES_PASSWORD: bigbread
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigbread"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # 운영 이미지가 빌드되는지, 운영 Compose 파일이 올바른지 확인한다 (이미지는 올리지 않는다).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compose 파일 검사
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          DB_PASSWORD: ci-check
          APP_BASE_URL: https://example.com
      - name: api 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: collector 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: collector
          push: false
          cache-from: type=gha,scope=api
      - name: web 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
