# 운영(서버 1대)용 Compose. 개발용 docker-compose.yml 과 따로 쓴다.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# 필요한 값은 .env.production.example 을 복사해 .env 로 만들어 채운다 (서버에만 두고 git 에는 올리지 않는다).
name: bigbread

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bigbread}
      POSTGRES_USER: ${DB_USERNAME:-bigbread}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 정해 주세요}
    # 작은 서버(메모리 2GB)에 맞춘 값. 포트는 밖으로 열지 않는다 (같은 Compose 네트워크의 api 만 접속).
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bigbread} -d ${DB_NAME:-bigbread}"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-bigbread}
      DB_USERNAME: ${DB_USERNAME:-bigbread}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL 을 .env 에 정해 주세요 (https://도메인)}
      SESSION_COOKIE_SECURE: "true"
      FORWARD_HEADERS_STRATEGY: framework
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-7d}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PHOTO_STORAGE: ${PHOTO_STORAGE:-s3}
      PHOTO_DIR: /data/uploads
      PHOTO_S3_ENDPOINT: ${PHOTO_S3_ENDPOINT:-}
      PHOTO_S3_REGION: ${PHOTO_S3_REGION:-auto}
      PHOTO_S3_BUCKET: ${PHOTO_S3_BUCKET:-}
      PHOTO_S3_ACCESS_KEY: ${PHOTO_S3_ACCESS_KEY:-}
      PHOTO_S3_SECRET_KEY: ${PHOTO_S3_SECRET_KEY:-}
      PHOTO_S3_PATH_STYLE: ${PHOTO_S3_PATH_STYLE:-true}
      # 가입 방식: email(메일 인증) | instant(이메일은 받되 인증 없이 바로 가입) | open(이메일 없이 바로 가입) | pass(휴대폰 본인확인)
      AUTH_SIGNUP_MODE: ${AUTH_SIGNUP_MODE:-email}
      # 본인확인(AUTH_SIGNUP_MODE=pass): 제공자와 연계정보 해시용 비밀값 (한 번 정하면 바꾸지 말 것)
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-none}
      PASS_DI_PEPPER: ${PASS_DI_PEPPER:-}
      # 메일(SMTP). MAIL_HOST 를 비우면 자체 회원가입·비밀번호 재설정이 꺼진다 (소셜 로그인만)
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SECURITY: ${MAIL_SECURITY:-STARTTLS}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-대빵}
    # PHOTO_STORAGE=local 일 때만 쓰이는 사진 폴더 (기본은 S3 호환 저장소라 비어 있다)
    volumes:
      - uploads:/data/uploads
    mem_limit: 900m
    logging: *logging

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
      args:
        KAKAO_JS_KEY: ${KAKAO_JS_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging: *logging

  # 일회성 작업: docker compose -f docker-compose.prod.yml run --rm collector --collector.job=kakao-bakeries
  collector:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: collector
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-bigbread}
      DB_USERNAME: ${DB_USERNAME:-bigbread}
      DB_PASSWORD: ${DB_PASSWORD}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
    mem_limit: 512m
    logging: *logging

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
