spring:
  config:
    # 레포 루트의 .env를 읽는다 (bootRun의 작업 디렉터리는 모듈 폴더라서 ../ 도 함께 시도)
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: bigbread-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:bigbread}}
    username: ${DB_USERNAME:bigbread}
    password: ${DB_PASSWORD:bigbread}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # dev 프로필의 샘플 데이터(R__) 이력이 남은 DB를 기본 프로필로 열어도 검증이 실패하지 않게 한다.
    ignore-migration-patterns: "repeatable:missing"

  mvc:
    problemdetails:
      enabled: true

bigbread:
  kakao:
    # 서버에서만 쓰는 REST API 키 (.env의 KAKAO_REST_API_KEY). 없으면 직선 추정으로 동작한다.
    rest-api-key: ${KAKAO_REST_API_KEY:}

  auth:
    # 사용자가 접속하는 주소. 제공자 콘솔에 등록할 리다이렉트 URI는 {base-url}/login/oauth2/code/{kakao|naver|google}
    base-url: ${APP_BASE_URL:http://localhost:5173}
    # 클라이언트 ID가 비어 있는 제공자는 로그인 버튼이 나오지 않는다. (카카오 클라이언트 ID = REST API 키)
    kakao:
      client-id: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # HTTPS로 배포하면 true로 (SESSION_COOKIE_SECURE=true)
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
